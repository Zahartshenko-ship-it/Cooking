<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookHelper — Умный шеф</title>
    <link rel="stylesheet" href="/static/style/styles.css">
</head>
<body>
    
<!-- Экран заставки (прелоадер) -->
<div id="intro-screen">
    <div class="intro-logo">
        <img src="/static/images/cooking.png" alt="Logo CookHelper">
        CookHelper
    </div>
</div>
<img src="/static/images/Бургер-шапка.png" alt="Вкусный бургер" class="burger-img">

<div class="column">
    <h2 style="font-size: 34px;">Ваши ингредиенты</h2>
    
    <div class="search-group">
        <input type="text" id="ingredientInput" placeholder="Введите ингредиент (например: огурец)">            
        <div class="suggestions" id="suggestionsBox"></div>
        <button class="btn-add" onclick="manualAdd()">Добавить</button>
        <a href="#resultsArea" style="text-decoration: none;">
            <button class="btn-find-recipes" onclick="findRecipes()">Найти рецепты</button>
        </a>      
    </div>

        <div class="empty-state">Ваш холодильник пуст</div>
    </div>
</div>
<div class="floating-fridge" id="floatingFridge" onclick="toggleFridgeMenu()">
    <img src="/static/images/холодильник.png" class="fridge-icon-img" alt="Холодильник">
    <span class="fridge-counter" id="fridgeCounter">0</span>
</div>

<div class="fridge-drawer" id="fridgeDrawer">
    <div class="drawer-header">
        <h3>В твоем холодильнике</h3>
        <button class="close-drawer" onclick="toggleFridgeMenu()">×</button>
    </div>

    <div class="fridge-list" id="fridgeList"></div>
</div>

<div class="column">
    <div class="title-wrapper">
        <h2 class="title-block">ВАШИ ИНГРЕДИЕНТЫ</h2>
    </div>
    <div id="resultsArea">
        <div class="empty-state">Добавьте продукты, чтобы увидеть рецепты</div>
    </div>
</div>

<div class="modal-overlay" id="detailOverlay" onclick="handleDetailOverlayClick(event)">
    <div class="modal" id="recipeDetailContent">
        </div>
</div>

<div class="recipe-form-hero">
    <div class="gingerbread-house"></div>
    <div class="recipe-form-container">
        <div class="recipe-header-block">
            <h2>Добавьте свой рецепт</h2>
        </div>
        
        <form id="recipeForm" class="modern-form">
            <div class="form-group">
                <label for="recipeName" class="form-label">
                    <span class="label-icon"></span>
                    Название блюда
                </label>
                <input type="text" id="recipeName" class="form-input" required placeholder="Например, Пряники">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon"></span>
                    Ингредиенты
                </label>
                <div id="ingredientsList" class="ingredients-container">
                    <div class="ingredient-input-wrap">
                        <input type="text" class="ingredient-input form-input" placeholder="Мука, корица..." required>
                        <button type="button" class="remove-ing-btn" onclick="removeIngredient(this)" title="Удалить">×</button>
                    </div>
                </div>
                <button type="button" id="addIngredientBtn" class="add-ingredient-btn">
                    <span>+</span> Добавить ингредиент
                </button>
            </div>

            <div class="form-group">
                <label for="recipeDescription" class="form-label">
                    <span class="label-icon"></span>
                    Инструкция / Описание
                </label>
                <textarea id="recipeDescription" class="form-textarea" rows="4" placeholder="Смешать, выпекать с любовью..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span></span> Сохранить рецепт
            </button>
        </form>
        
        <div id="formMessage" class="hidden"></div>
    </div>
</div>

<script src="/static/codes/recipe.js"></script>
<script src="/static/codes/code.js"></script>

</body>
</html>
