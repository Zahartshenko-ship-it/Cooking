<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookHelper — Умный шеф</title>
    <link rel="stylesheet" href="/static/style/styles.css">
</head>
<body>
    
<!-- Экран заставки (прелоадер) -->
<div id="intro-screen">
    <div class="intro-logo">
        <img src="/static/images/cooking.png" alt="Logo CookHelper">
        CookHelper
    </div>
</div>
<!-- <img src="/static/images/Бургер-шапка.png" alt="Вкусный бургер" class="burger-img"> -->

<div class="food-carousel-container">
    <div class="food-carousel-track" id="carouselTrack">
        <div class="food-carousel-item"><img src="/static/images/Бургеры.png" alt="Блюдо 1"></div>
        <div class="food-carousel-item"><img src="/static/images/Пельмени.png" alt="Блюдо 2"></div>
        <div class="food-carousel-item"><img src="/static/images/Пирог.png" alt="Блюдо 3"></div>
        <div class="food-carousel-item"><img src="/static/images/Лобстеры.png" alt="Блюдо 4"></div>
        <div class="food-carousel-item"><img src="/static/images/Курица.png" alt="Блюдо 5"></div>
        <div class="food-carousel-item"><img src="/static/images/Яичница.png" alt="Блюдо 6"></div>
        <div class="food-carousel-item"><img src="/static/images/Блины.png" alt="Блюдо 7"></div>
        <div class="food-carousel-item"><img src="/static/images/Овощи.png" alt="Блюдо 8"></div>
    </div>
</div>

<div class="column">
    <h2 style="font-size: 34px;">Ваши ингредиенты</h2>
    
    <div class="search-group">
        <input type="text" id="ingredientInput" placeholder="Введите ингредиент (например: огурец)">            
        <div class="suggestions" id="suggestionsBox" onclick="animateFlyToFridge(event)"></div>
        <button class="btn-add" id="addBtn" onclick="manualAdd(); animateFlyToFridge(event)">Добавить</button>
        <a href="#resultsArea" style="text-decoration: none;">
            <button class="btn-find-recipes" onclick="findRecipes()">Найти рецепты</button>
        </a>      
    </div>

        <div class="empty-state">Ваш холодильник пуст</div>
    </div>
</div>
<div class="floating-fridge" id="floatingFridge" onclick="toggleFridgeMenu()">
    <img src="/static/images/холодильник.png" class="fridge-icon-img" id="fridgeIcon" alt="Холодильник">
    <span class="fridge-counter" id="fridgeCounter">0</span>
</div>

<div class="fridge-drawer" id="fridgeDrawer">
    <div class="drawer-header">
        <h3>В твоем холодильнике</h3>
        <button class="close-drawer" onclick="toggleFridgeMenu()">×</button>
    </div>

    <div class="fridge-list" id="fridgeList"></div>
</div>

<div class="column">
    <div class="title-wrapper">
        <h2 class="title-block">ВАШИ ИНГРЕДИЕНТЫ</h2>
    </div>
    <div id="resultsArea">
        <div class="empty-state">Добавьте продукты, чтобы увидеть рецепты</div>
    </div>
</div>

<div class="modal-overlay" id="detailOverlay" onclick="handleDetailOverlayClick(event)">
    <div class="modal" id="recipeDetailContent">
        </div>
</div>

<div class="recipe-form-hero">
    <div class="gingerbread-house"></div>
    <div class="recipe-form-container">
        <div class="recipe-header-block">
            <h2>Добавьте свой рецепт</h2>
        </div>
        
        <form id="recipeForm" class="modern-form">
            <div class="form-group">
                <label for="recipeName" class="form-label">
                    <span class="label-icon"></span>
                    Название блюда
                </label>
                <input type="text" id="recipeName" class="form-input" required placeholder="Например, Пряники">
            </div>
            <menu>
            <button id="updateDetails" class="add-ingredient-btn">Добавить ингридиенты</button>
            </menu>

            <div class="form-group">
                <label for="recipeDescription" class="form-label">
                    <span class="label-icon"></span>
                    Инструкция / Описание
                </label>
                <textarea id="recipeDescription" class="form-textarea" rows="4" placeholder="Смешать, выпекать с любовью..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span></span> Сохранить рецепт
            </button>
        </form>
        
        <div id="formMessage" class="hidden"></div>
    </div>
</div>
<dialog id="favDialog" style="border: none; outline: none; border-radius: 20px;">
    <div class="form-group">
        <label class="form-label" style="color: black;">
            <span class="label-icon"></span>
            Ингредиенты
        </label>
        
        <div id="ingredientsList" class="ingredients-container">
            <div class="ingredient-input-wrap">
                <input type="text" class="ingredient-input form-input" placeholder="Мука, корица...">
                <button type="button" class="remove-ing-btn" onclick="removeIngredient(this)" title="Удалить">&times;</button>
            </div>
        </div>
        
        <div style="display: flex; gap: 5px; flex-direction: column;">
            <button type="button" id="addIngredientBtn" class="add-ingredient-btn" onclick="addIngredientField()">
                <span>+</span> Добавить ингредиент
            </button>
            <button type="button" id="cancel" class="add-ingredient-btn" style="justify-content: center;" onclick="submitRecipe()">
                Сохранить
            </button>
            <div id="dialogMessage" style="text-align: center; min-height: 20px; font-size: 14px; margin-top: 5px; transition: opacity 0.3s; opacity: 0; font-weight: 500;"></div>
        </div>
    </div>
</dialog>

<script>
    // Этот скрипт нужен только для создания бесконечного эффекта
    document.addEventListener('DOMContentLoaded', function() {
        const track = document.getElementById('carouselTrack');
        
        // 1. Получаем все оригинальные элементы
        const items = track.querySelectorAll('.food-carousel-item');
        
        // 2. Дублируем их и добавляем в конец ленты
        // Это создает 'запас', чтобы при сдвиге на 100%
        // в кадре уже были те же самые картинки, и переход был незаметен.
        items.forEach(item => {
            const clone = item.cloneNode(true);
            track.appendChild(clone);
        });
    });
</script>

<script>
  (function () {
    var updateButton = document.getElementById("updateDetails");
    var cancelButton = document.getElementById("cancel");
    var favDialog = document.getElementById("favDialog");
    var dialogMessage = document.getElementById("dialogMessage");

    window.showDialogMessage = function(text, color) {
        if (!dialogMessage) return;
        dialogMessage.textContent = text;
        dialogMessage.style.color = color || '#333';
        dialogMessage.style.opacity = '1';

        clearTimeout(window.dialogMessageTimer);
        window.dialogMessageTimer = setTimeout(() => {
            dialogMessage.style.opacity = '0';
        }, 2000);
    };

    updateButton.addEventListener("click", function () {
      favDialog.showModal();
    });

    // ОБНОВЛЕННЫЙ КОД: Проверка перед закрытием
    cancelButton.addEventListener("click", function () {
        const ingredientInputs = document.querySelectorAll('.ingredient-input');

    // Ищем, есть ли хоть один инпут с пробелом или запятой
    const invalidInput = Array.from(ingredientInputs).find(input => /[,\s]/.test(input.value));

    if (invalidInput) {
        invalidInput.classList.remove('input-error');
        void invalidInput.offsetWidth;
        invalidInput.classList.add('input-error');
        invalidInput.focus();

        // Выводим ошибку красным цветом внутри модального окна
        window.showDialogMessage("Ошибка: используйте '_' вместо пробелов и удалите запятые!", "#dc3545");
        return; // Блокируем закрытие окна
    }

    // Если всё хорошо — сохраняем и закрываем
    window.showDialogMessage("Ингредиенты сохранены!", "#28a745");
    setTimeout(() => {
        favDialog.close();
        dialogMessage.style.opacity = '0';
    }, 1000);
    });
  })();
</script>
<script src="/static/codes/recipe.js"></script>
<script src="/static/codes/code.js"></script>

</body>
</html>
